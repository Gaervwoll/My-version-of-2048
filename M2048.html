<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="2048 Осень">
<meta name="theme-color" content="#3a2410">
<title>2048 — осень</title>
<style>
  :root {
    --bg:            #3a2410;
    --board-bg:      #5c3a1a;
    --cell-empty:    #e8d9c0;
    --text-light:    #f5e6c8;
    --accent:        #c05229;
    --accent-dark:   #9c2a3b;
    --gold:          #edc22e;
    --header-label:  #d9b98a;
    --pad: 10px;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text-light);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
  }

  #app {
    position: fixed; inset: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 0; overflow: hidden;
  }

  header {
    width: 100%; max-width: 100%;
    padding: 8px 14px 4px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex: 0 0 auto;
  }
  .logo { display: flex; flex-direction: column; line-height: 1; }
  .logo-title {
    font-size: clamp(24px, 7vw, 34px);
    font-weight: 800; color: var(--text-light); letter-spacing: -0.5px;
  }
  .logo-sub {
    font-size: clamp(10px, 2.6vw, 12px);
    color: var(--accent); font-style: italic; margin-top: 2px;
  }
  .score-plate {
    display: flex; background: var(--board-bg);
    border-radius: 12px; overflow: hidden;
    padding: 6px 4px; max-width: 60vw;
  }
  .score-half {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 2px 8px; min-width: 0;
  }
  .score-half + .score-half { border-left: 1px solid var(--accent); }
  .score-label {
    font-size: clamp(8px, 2.2vw, 10px);
    letter-spacing: 0.5px; color: var(--header-label);
    font-weight: 700; text-transform: uppercase;
  }
  .score-value {
    font-size: clamp(14px, 4vw, 20px);
    font-weight: 800; color: #fff; margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }
  .score-value.high { color: var(--gold); }

  .toolbar {
    width: 100%; max-width: 100%;
    padding: 0 14px 6px; flex: 0 0 auto;
    display: flex; align-items: center;
    justify-content: flex-start; gap: 8px;
  }
  .toolbar button {
    padding: 6px 12px;
    font-size: clamp(11px, 3vw, 13px);
    font-weight: 700; color: var(--text-light);
    background: var(--board-bg);
    border: 1px solid var(--accent);
    border-radius: 10px; cursor: pointer;
    letter-spacing: 0.4px;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background 0.15s, opacity 0.15s;
  }
  .toolbar button:active { background: var(--accent-dark); }
  .toolbar button:disabled { opacity: 0.4; pointer-events: none; }

  #board {
    position: relative;
    background: var(--board-bg);
    border-radius: 12px;
    padding: var(--pad);
    margin: 4px 0;
    flex: 0 0 auto;
    touch-action: none;
  }
  #board-inner { position: relative; width: 100%; height: 100%; }
  .cell {
    position: absolute; background: var(--cell-empty); border-radius: 8px;
  }
  .tile {
    position: absolute;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px; font-weight: 800;
    will-change: transform; z-index: 2;
    font-variant-numeric: tabular-nums;
  }

  #overlay {
    position: absolute; inset: var(--pad, 10px);
    border-radius: 8px; background: rgba(0, 0, 0, 0.55);
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 5; text-align: center; padding: 16px; gap: 12px;
  }
  #overlay.show { display: flex; }
  #overlay .overlay-title { font-size: clamp(20px, 6vw, 28px); font-weight: 800; color: #fff; }
  #overlay .overlay-sub   { font-size: clamp(11px, 3vw, 14px); color: var(--header-label); }
  #overlay button {
    margin-top: 6px; padding: 10px 20px;
    font-size: clamp(12px, 3.2vw, 14px);
    font-weight: 700; color: #fff;
    background: var(--accent); border: none;
    border-radius: 10px; cursor: pointer;
    letter-spacing: 0.5px; transition: background 0.15s;
  }
  #overlay button:active { background: var(--accent-dark); }

  .controls {
    display: flex; gap: 10px;
    padding: 6px 14px calc(8px + env(safe-area-inset-bottom));
    flex: 0 0 auto; justify-content: center;
  }
  .controls button {
    flex: 1 1 auto; min-width: 110px; max-width: 180px;
    padding: 10px 14px;
    font-size: clamp(12px, 3.2vw, 14px);
    font-weight: 700; color: #fff;
    background: var(--accent); border: none;
    border-radius: 10px; cursor: pointer;
    letter-spacing: 0.4px;
    transition: background 0.15s, opacity 0.15s;
  }
  .controls button:active { background: var(--accent-dark); }
  .controls button:disabled { opacity: 0.4; pointer-events: none; }

  .modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.65);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 16px;
    padding: calc(16px + env(safe-area-inset-top))
             calc(16px + env(safe-area-inset-right))
             calc(16px + env(safe-area-inset-bottom))
             calc(16px + env(safe-area-inset-left));
  }
  .modal.show { display: flex; }
  .modal-card {
    width: 100%; max-width: 420px;
    background: var(--board-bg);
    border-radius: 16px; padding: 18px;
    display: flex; flex-direction: column; gap: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .modal-title { font-size: clamp(16px, 4.5vw, 20px); font-weight: 800; color: #fff; text-align: center; }
  .modal-sub   { font-size: clamp(11px, 3vw, 13px); color: var(--header-label); text-align: center; line-height: 1.4; }
  #hash-io {
    width: 100%; min-height: 90px; max-height: 160px;
    resize: vertical; background: #2e1a0f; color: var(--text-light);
    border: 1px solid var(--accent); border-radius: 10px;
    padding: 10px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: clamp(11px, 3vw, 13px); line-height: 1.4;
    word-break: break-all;
    -webkit-user-select: text; user-select: text;
    -webkit-touch-callout: default;
  }
  #hash-io:focus { outline: 2px solid var(--gold); }
  .modal-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .modal-actions button {
    flex: 1 1 auto; min-width: 100px;
    padding: 10px 14px; border: none; border-radius: 10px;
    font-weight: 700; font-size: clamp(11px, 3vw, 13px);
    cursor: pointer; letter-spacing: 0.4px;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:active { background: var(--accent-dark); }
  .btn-secondary {
    background: transparent; color: var(--text-light);
    border: 1px solid var(--accent);
  }
  .btn-secondary:active { background: rgba(192,82,41,0.2); }
  .btn-danger { background: var(--accent-dark); color: #fff; }
  .btn-danger:active { background: #6d1a28; }
  .modal-status {
    min-height: 1em; font-size: clamp(10px, 2.8vw, 12px);
    text-align: center; color: var(--gold);
  }
  .modal-status.error { color: #ff8080; }
</style>
</head>
<body>

<!-- ==================== ОСНОВНОЙ КАРКАС ==================== -->
<div id="app">
  <header>
    <div class="logo">
      <div class="logo-title">2048</div>
      <div class="logo-sub">осеннее издание</div>
    </div>
    <div class="score-plate">
      <div class="score-half">
        <div class="score-label">Счёт</div>
        <div class="score-value" id="score">0</div>
      </div>
      <div class="score-half">
        <div class="score-label">Рекорд</div>
        <div class="score-value high" id="highscore">0</div>
      </div>
    </div>
  </header>

  <div class="toolbar" id="toolbar">
    <button id="share-btn" type="button">🔗 Хеш</button>
  </div>

  <div id="board">
    <div id="board-inner"></div>
    <div id="overlay">
      <div class="overlay-title" id="overlay-title"></div>
      <div class="overlay-sub" id="overlay-sub"></div>
      <button id="overlay-btn"></button>
    </div>
  </div>

  <div class="controls" id="controls">
    <button id="undo-btn" type="button" disabled>↶ Отмена</button>
    <button id="new-btn" type="button">⟳ Новая игра</button>
  </div>
</div>

<!-- ==================== МОДАЛКА ПОДТВЕРЖДЕНИЯ ==================== -->
<div id="confirm-modal" class="modal">
  <div class="modal-card">
    <div class="modal-title">Начать новую игру?</div>
    <div class="modal-sub">
      Текущий прогресс будет потерян.<br>
      Это действие нельзя отменить.
    </div>
    <div class="modal-actions">
      <button id="confirm-cancel" class="btn-secondary" type="button">Отмена</button>
      <button id="confirm-ok"     class="btn-danger"    type="button">Начать</button>
    </div>
  </div>
</div>

<!-- ==================== МОДАЛКА ШАРИНГА ==================== -->
<div id="share-modal" class="modal">
  <div class="modal-card">
    <div class="modal-title">Хеш-ключ партии</div>
    <div class="modal-sub">
      Скопируйте ключ, чтобы поделиться партией,<br>
      или вставьте чужой ключ и нажмите «Загрузить».
    </div>
    <textarea id="hash-io" spellcheck="false" autocomplete="off"
              autocapitalize="off" autocorrect="off"></textarea>
    <div class="modal-actions">
      <button id="hash-copy"  class="btn-primary"   type="button">Скопировать</button>
      <button id="hash-load"  class="btn-primary"   type="button">Загрузить</button>
      <button id="hash-close" class="btn-secondary" type="button">Закрыть</button>
    </div>
    <div id="hash-status" class="modal-status"></div>
  </div>
</div>

<script>
(() => {
  "use strict";

  /* ============================================================
   * CONFIG
   * ============================================================ */
  const CFG = {
    BASE_SIZE: 4,            // стартовый размер поля (строк и столбцов)
    WIN_THRESHOLDS: [2048, 4096, 8192, 16384, 32768, 65536, 131072],
    EXPAND_AT: 4096,         // при достижении этой плитки добавляем строку снизу
    EXPAND_STEP: 1,          // сколько строк добавлять
    MAX_ROWS: 12,            // защита от бесконечного роста
    ANIM_MS: 110,
    SPAWN_MS: 130,
    MERGE_MS: 140,
    SWIPE_MIN: 22,
    SCORE_KEY: "game2048_autumn_highscore",
    STATE_KEY: "game2048_autumn_state",
    SEED_KEY:  "game2048_autumn_last_seed",
    MAX_UNDO: 5000,
    AUTOSAVE: true,
    HASH_PREFIX: "A2048:",
    HASH_VERSION_1: 1,       // фиксированное поле 4×4
    HASH_VERSION_2: 2,       // переменное поле rows×cols
  };

  /* ============================================================
   * PALETTE
   * ============================================================ */
  const TILE_COLORS = {
    0:    ["#e8d9c0", "#8a7560"],
    2:    ["#f7dd72", "#ffffff"],
    4:    ["#f2d69b", "#ffffff"],
    8:    ["#e8b96a", "#ffffff"],
    16:   ["#e0a04a", "#ffffff"],
    32:   ["#d98536", "#ffffff"],
    64:   ["#cc6b2c", "#ffffff"],
    128:  ["#c05229", "#ffffff"],
    256:  ["#b03a2e", "#ffffff"],
    512:  ["#9c2a3b", "#ffffff"],
    1024: ["#7d1f4a", "#ffffff"],
    2048: ["#5c1a4d", "#ffffff"],
    4096: ["#4a2b6b", "#ffffff"],
    8192: ["#3a2e7a", "#ffffff"],
    16384:["#2c3e78", "#ffffff"],
    32768:["#1f3054", "#ffffff"],
    65536:["#4a2b1a", "#ffd9a8"],
    131072:["#2e1a0f", "#ffb870"],
  };
  const HIGH_PALETTE = [
    ["#4a2b1a", "#ffd9a8"],
    ["#2e1a0f", "#ffb870"],
    ["#5c3a1a", "#ffe4b5"],
    ["#3a2410", "#ffcc88"],
    ["#6b4423", "#fff0d4"],
  ];
  function tileStyle(v) {
    if (TILE_COLORS[v]) return TILE_COLORS[v];
    const idx = (Math.log2(v) - 18) % HIGH_PALETTE.length;
    return HIGH_PALETTE[(idx + HIGH_PALETTE.length) % HIGH_PALETTE.length];
  }
  function fontSizeFor(v, cellSize) {
    const digits = String(v).length;
    let ratio;
    if (digits <= 1) ratio = 0.46;
    else if (digits === 2) ratio = 0.42;
    else if (digits === 3) ratio = 0.36;
    else if (digits === 4) ratio = 0.30;
    else if (digits === 5) ratio = 0.24;
    else ratio = 0.20;
    return Math.round(cellSize * ratio);
  }

  /* ============================================================
   * RNG
   * ============================================================ */
  function createRng(seed) {
    return {
      state: seed >>> 0,
      next() {
        this.state = (this.state + 0x6D2B79F5) >>> 0;
        let t = this.state;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      },
      snapshot() { return this.state >>> 0; },
      restore(s) { this.state = s >>> 0; }
    };
  }
  function randomSeed() {
    return (Math.floor(Math.random() * 4294967296)) >>> 0;
  }

  /* ============================================================
   * DOM
   * ============================================================ */
  const $ = id => document.getElementById(id);
  const boardEl      = $("board");
  const boardInner   = $("board-inner");
  const scoreEl      = $("score");
  const highEl       = $("highscore");
  const undoBtn      = $("undo-btn");
  const newBtn       = $("new-btn");
  const overlay      = $("overlay");
  const overlayTitle = $("overlay-title");
  const overlaySub   = $("overlay-sub");
  const overlayBtn   = $("overlay-btn");
  const shareBtn     = $("share-btn");
  const shareModal   = $("share-modal");
  const hashIO       = $("hash-io");
  const hashCopy     = $("hash-copy");
  const hashLoad     = $("hash-load");
  const hashClose    = $("hash-close");
  const hashStatus   = $("hash-status");
  const confirmModal = $("confirm-modal");
  const confirmOk    = $("confirm-ok");
  const confirmCancel= $("confirm-cancel");

  /* ============================================================
   * STATE
   * ============================================================ */
  const state = {
    rows: CFG.BASE_SIZE,
    cols: CFG.BASE_SIZE,
    board: [],
    score: 0,
    highscore: 0,
    achieved: new Set(),
    gameOver: false,
    animating: false,
    undoStack: [],
    seed: 0,
    rng: createRng(1),
    expandedAt: new Set(),   // какие пороги расширения уже сработали
  };

  const layout = { pad: 10, cellSize: 70, gap: 10 };

  const tileEls = new Map();
  let nextTileId = 0;

  /* ============================================================
   * GEOMETRY
   * ============================================================ */
  function computeLayout() {
    const vv = window.visualViewport;
    const vw = (vv ? vv.width  : window.innerWidth);
    const vh = (vv ? vv.height : window.innerHeight);

    const headerEl   = document.querySelector("header");
    const toolbarEl  = $("toolbar");
    const controlsEl = $("controls");

    const headerH   = headerEl   ? headerEl.getBoundingClientRect().height   : 0;
    const toolbarH  = toolbarEl  ? toolbarEl.getBoundingClientRect().height  : 0;
    const controlsH = controlsEl ? controlsEl.getBoundingClientRect().height : 0;

    const margin = 8;
    const availW = vw - 2 * margin;
    const availH = vh - headerH - toolbarH - controlsH - 2 * margin;

    // Ограничиваем по обеим осям с учётом соотношения rows/cols
    const maxSide = Math.max(200, Math.min(availW, availH));
    const cols = state.cols;
    const rows = state.rows;
    // Подбираем такой размер, чтобы и ширина, и высота поля влезли
    const cellW = maxSide / cols;
    const cellH = maxSide / rows;
    const boardW = maxSide;
    const boardH = maxSide * (rows / cols);
    const boardSideW = Math.min(boardW, maxSide);
    const boardSideH = Math.min(boardH, maxSide);

    // pad/gap зависят от меньшей стороны ячейки
    const approxCell = Math.min(boardSideW / cols, boardSideH / rows);
    const gap = Math.max(5, Math.round(approxCell * 0.10));
    const pad = Math.max(8, Math.round(approxCell * 0.14));

    const innerW = boardSideW - 2 * pad;
    const innerH = boardSideH - 2 * pad;
    const cellW2 = (innerW - (cols - 1) * gap) / cols;
    const cellH2 = (innerH - (rows - 1) * gap) / rows;
    const cellSize = Math.min(cellW2, cellH2);

    layout.pad = pad;
    layout.gap = gap;
    layout.cellSize = cellSize;

    document.documentElement.style.setProperty("--pad", pad + "px");
    boardEl.style.width  = boardSideW + "px";
    boardEl.style.height = boardSideH + "px";
    boardInner.style.width  = innerW + "px";
    boardInner.style.height = innerH + "px";

    renderEmptyCells();
    for (const t of tileEls.values()) {
      placeTileEl(t, t.r, t.c, false);
      updateFontSize(t);
    }
  }

  function cellXY(r, c) {
    return {
      x: c * (layout.cellSize + layout.gap),
      y: r * (layout.cellSize + layout.gap),
      size: layout.cellSize
    };
  }

  function renderEmptyCells() {
    boardInner.querySelectorAll(".cell").forEach(el => el.remove());
    for (let r = 0; r < state.rows; r++) {
      for (let c = 0; c < state.cols; c++) {
        const { x, y, size } = cellXY(r, c);
        const div = document.createElement("div");
        div.className = "cell";
        div.style.left = x + "px";
        div.style.top = y + "px";
        div.style.width = size + "px";
        div.style.height = size + "px";
        boardInner.appendChild(div);
      }
    }
  }

  /* ============================================================
   * TILES
   * ============================================================ */
  function createTileEl(r, c, value, animateSpawn = true) {
    const { x, y, size } = cellXY(r, c);
    const [bg, fg] = tileStyle(value);

    const el = document.createElement("div");
    el.className = "tile";
    el.style.width = size + "px";
    el.style.height = size + "px";
    el.style.left = "0px";
    el.style.top = "0px";
    el.style.transform = `translate(${x}px, ${y}px)`;
    el.style.background = bg;
    el.style.color = fg;
    el.textContent = String(value);
    boardInner.appendChild(el);

    const tile = { el, r, c, value };
    updateFontSize(tile);

    if (animateSpawn) {
      el.style.transition = `transform ${CFG.SPAWN_MS}ms ease-out, ` +
                            `width ${CFG.SPAWN_MS}ms ease-out, ` +
                            `height ${CFG.SPAWN_MS}ms ease-out`;
      el.animate(
        [{ transform: `translate(${x}px, ${y}px) scale(0)` },
         { transform: `translate(${x}px, ${y}px) scale(1)` }],
        { duration: CFG.SPAWN_MS, easing: "ease-out" }
      );
    }
    return tile;
  }

  function placeTileEl(tile, r, c, animated = true) {
    const { x, y } = cellXY(r, c);
    tile.r = r; tile.c = c;
    tile.el.style.transition = animated
      ? `transform ${CFG.ANIM_MS}ms cubic-bezier(.22,.61,.36,1)`
      : "none";
    tile.el.style.transform = `translate(${x}px, ${y}px)`;
  }

  function updateFontSize(tile) {
    const fs = fontSizeFor(tile.value, layout.cellSize);
    tile.el.style.fontSize = fs + "px";
    const [bg, fg] = tileStyle(tile.value);
    tile.el.style.background = bg;
    tile.el.style.color = fg;
    tile.el.textContent = String(tile.value);
  }

  function setTileValue(tile, value) {
    tile.value = value;
    updateFontSize(tile);
  }

  function getTileId(tile) {
    for (const [id, t] of tileEls.entries()) if (t === tile) return id;
    return null;
  }

  function transformFor(r, c, scale = 1) {
    const { x, y } = cellXY(r, c);
    return `translate(${x}px, ${y}px) scale(${scale})`;
  }

  /* ============================================================
   * GAME_LOGIC
   * ============================================================ */
  function emptyCells(b) {
    const out = [];
    for (let r = 0; r < state.rows; r++)
      for (let c = 0; c < state.cols; c++)
        if (b[r][c] === 0) out.push([r, c]);
    return out;
  }

  function spawnRandom(b) {
    const cells = emptyCells(b);
    if (!cells.length) return null;
    const idx = Math.floor(state.rng.next() * cells.length);
    const [r, c] = cells[idx];
    b[r][c] = state.rng.next() < 0.9 ? 2 : 4;
    return [r, c];
  }

  function compress(row) {
    const nz = row.filter(v => v !== 0);
    while (nz.length < state.cols) nz.push(0);
    return nz;
  }

  function mergeRow(row) {
    let gained = 0;
    for (let i = 0; i < state.cols - 1; i++) {
      if (row[i] !== 0 && row[i] === row[i + 1]) {
        row[i] *= 2;
        row[i + 1] = 0;
        gained += row[i];
      }
    }
    return [row, gained];
  }

  function reverse(b) { return b.map(r => [...r].reverse()); }
  function transpose(b) {
    const out = [];
    for (let c = 0; c < state.cols; c++) {
      const col = [];
      for (let r = 0; r < state.rows; r++) col.push(b[r][c]);
      out.push(col);
    }
    return out;
  }

  function slideLeft(b) {
    const nb = [];
    let gained = 0, moved = false;
    for (const row of b) {
      let nr = compress(row);
      let g;
      [nr, g] = mergeRow(nr);
      gained += g;
      nr = compress(nr);
      if (nr.some((v, i) => v !== row[i])) moved = true;
      nb.push(nr);
    }
    return [nb, gained, moved];
  }

  function computeMove(b, dir) {
    let bb = b.map(r => [...r]);
    if (dir === "left")  return slideLeft(bb);
    if (dir === "right") {
      bb = reverse(bb);
      let [nb, g, m] = slideLeft(bb);
      return [reverse(nb), g, m];
    }
    if (dir === "up") {
      bb = transpose(bb);
      let [nb, g, m] = slideLeft(bb);
      return [transpose(nb), g, m];
    }
    if (dir === "down") {
      bb = transpose(bb);
      bb = reverse(bb);
      let [nb, g, m] = slideLeft(bb);
      nb = reverse(nb);
      return [transpose(nb), g, m];
    }
    return [bb, 0, false];
  }

  function canMove(b) {
    for (let r = 0; r < state.rows; r++)
      for (let c = 0; c < state.cols; c++) {
        if (b[r][c] === 0) return true;
        const v = b[r][c];
        if (c + 1 < state.cols && b[r][c + 1] === v) return true;
        if (r + 1 < state.rows && b[r + 1][c] === v) return true;
      }
    return false;
  }

  function maxValue() {
    let m = 0;
    for (const row of state.board) for (const v of row) if (v > m) m = v;
    return m;
  }

  /* ============================================================
   * EXPANSION  (рост поля снизу после 4096)
   * ============================================================ */
  function maybeExpandBoard() {
    const m = maxValue();
    if (m < CFG.EXPAND_AT) return false;
    if (state.expandedAt.has(CFG.EXPAND_AT)) return false;
    if (state.rows >= CFG.MAX_ROWS) return false;

    // Добавляем EXPAND_STEP пустых строк снизу
    for (let i = 0; i < CFG.EXPAND_STEP; i++) {
      state.board.push(new Array(state.cols).fill(0));
    }
    state.rows = state.board.length;
    state.expandedAt.add(CFG.EXPAND_AT);

    // Пересобираем раскладку и плитки
    computeLayout();
    redrawTiles();

    showOverlay(
      `ПОЛЕ РАСШИРЕНО ДО ${state.rows}×${state.cols}`,
      "Снизу добавлена новая строка. Игра продолжается!",
      "ПРОДОЛЖИТЬ",
      () => hideOverlay()
    );
    return true;
  }

  /* ============================================================
   * ANIMATION
   * ============================================================ */
  function planAnimation(oldBoard, newBoard, dir) {
    const tileAt = new Map();
    for (const t of tileEls.values()) tileAt.set(t.r + "," + t.c, t);
    const plan = [];

    function pairLine(srcCells, dstCells) {
      let si = 0;
      for (const [dr, dc] of dstCells) {
        if (si >= srcCells.length) break;
        const targetVal = newBoard[dr][dc];
        let acc = 0;
        const group = [];
        while (si < srcCells.length && acc < targetVal) {
          const [sr, sc] = srcCells[si];
          const v = oldBoard[sr][sc];
          acc += v;
          group.push({ sr, sc, v, tile: tileAt.get(sr + "," + sc) });
          si++;
          if (acc === targetVal) break;
        }
        if (group.length === 1) {
          const { tile, sr, sc, v } = group[0];
          if (tile) plan.push({ type: "move", tile, to: [dr, dc], value: v, from: [sr, sc] });
        } else if (group.length >= 2) {
          const first = group[0];
          if (first.tile) {
            plan.push({ type: "merge", tile: first.tile, to: [dr, dc],
                        newValue: targetVal, from: [first.sr, first.sc] });
          }
          for (let i = 1; i < group.length; i++) {
            const g = group[i];
            if (g.tile) {
              plan.push({ type: "merge_extra", tile: g.tile, to: [dr, dc],
                          from: [g.sr, g.sc] });
            }
          }
        }
      }
    }

    if (dir === "left" || dir === "right") {
      for (let r = 0; r < state.rows; r++) {
        let srcCells = [], dstCells = [];
        for (let c = 0; c < state.cols; c++) {
          if (oldBoard[r][c] !== 0) srcCells.push([r, c]);
          if (newBoard[r][c] !== 0) dstCells.push([r, c]);
        }
        if (dir === "right") { srcCells.reverse(); dstCells.reverse(); }
        pairLine(srcCells, dstCells);
      }
    } else {
      for (let c = 0; c < state.cols; c++) {
        let srcCells = [], dstCells = [];
        for (let r = 0; r < state.rows; r++) {
          if (oldBoard[r][c] !== 0) srcCells.push([r, c]);
          if (newBoard[r][c] !== 0) dstCells.push([r, c]);
        }
        if (dir === "down") { srcCells.reverse(); dstCells.reverse(); }
        pairLine(srcCells, dstCells);
      }
    }
    return plan;
  }

  function animatePlan(plan, onDone) {
    if (!plan.length) { onDone(); return; }
    for (const op of plan) placeTileEl(op.tile, op.to[0], op.to[1], true);

    setTimeout(() => {
      for (const op of plan) {
        if (op.type === "merge_extra") {
          op.tile.el.remove();
          tileEls.delete(getTileId(op.tile));
        }
      }
      for (const op of plan) {
        if (op.type === "merge") {
          setTileValue(op.tile, op.newValue);
          op.tile.el.animate(
            [{ transform: transformFor(op.tile.r, op.tile.c, 1) },
             { transform: transformFor(op.tile.r, op.tile.c, 1.12) },
             { transform: transformFor(op.tile.r, op.tile.c, 1) }],
            { duration: CFG.MERGE_MS, easing: "ease-out" }
          );
        }
      }
      setTimeout(onDone, CFG.MERGE_MS);
    }, CFG.ANIM_MS);
  }

  /* ============================================================
   * MOVES
   * ============================================================ */
  function handleMove(dir) {
    if (state.animating || state.gameOver) return;
    if (overlay.classList.contains("show")) return;

    const oldBoard = state.board.map(r => [...r]);
    const oldScore = state.score;
    const oldAchieved = new Set(state.achieved);

    const [newBoard, gained, moved] = computeMove(state.board, dir);
    if (!moved) return;

    state.undoStack.push({ board: oldBoard, score: oldScore, achieved: oldAchieved });
    if (state.undoStack.length > CFG.MAX_UNDO) state.undoStack.shift();
    undoBtn.disabled = false;

    const plan = planAnimation(oldBoard, newBoard, dir);

    state.board = newBoard;
    state.score += gained;
    if (state.score > state.highscore) {
      state.highscore = state.score;
      saveHighscore(state.highscore);
    }
    scoreEl.textContent = state.score;
    highEl.textContent = state.highscore;

    state.animating = true;
    animatePlan(plan, finalizeMove);
  }

  function finalizeMove() {
    for (const [id, t] of [...tileEls.entries()]) {
      if (state.board[t.r][t.c] === 0) {
        t.el.remove();
        tileEls.delete(id);
      }
    }

    // Сначала проверяем расширение поля (после достижения 4096)
    const expanded = maybeExpandBoard();

    if (!expanded) {
      const pos = spawnRandom(state.board);
      if (pos) {
        const [r, c] = pos;
        const id = nextTileId++;
        const tile = createTileEl(r, c, state.board[r][c], true);
        tileEls.set(id, tile);
      }
    }

    checkWinThresholds();

    if (!canMove(state.board)) {
      state.gameOver = true;
      showOverlay("ИГРА ОКОНЧЕНА", "Нажмите «Новая игра»", "⟳ Начать заново", () => {
        hideOverlay();
        requestNewGame();
      });
    }

    state.animating = false;
    saveState();
  }

  /* ============================================================
   * OVERLAY
   * ============================================================ */
  function showOverlay(title, sub, btnText, onClick) {
    overlayTitle.textContent = title;
    overlaySub.textContent = sub;
    overlayBtn.textContent = btnText;
    overlay.classList.add("show");
    overlayBtn.onclick = onClick;
  }
  function hideOverlay() {
    overlay.classList.remove("show");
    overlayBtn.onclick = null;
  }

  function checkWinThresholds() {
    const m = maxValue();
    for (const th of CFG.WIN_THRESHOLDS) {
      if (m >= th && !state.achieved.has(th)) {
        state.achieved.add(th);
        // Расширение уже обработано отдельно; здесь только поздравление
        if (th !== CFG.EXPAND_AT) {
          showOverlay(
            `УРОВЕНЬ ${th} ДОСТИГНУТ!`,
            "Продолжайте играть — впереди новые рубежи.",
            "ПРИНЯТЬ И ПРОДОЛЖИТЬ",
            () => hideOverlay()
          );
        }
        return;
      }
    }
  }

  /* ============================================================
   * SESSION
   * ============================================================ */
  function startGameWithSeed(seed) {
    state.seed = seed >>> 0;
    state.rng = createRng(state.seed);
    state.rows = CFG.BASE_SIZE;
    state.cols = CFG.BASE_SIZE;
    state.board = Array.from({ length: state.rows }, () => Array(state.cols).fill(0));
    state.score = 0;
    state.gameOver = false;
    state.achieved.clear();
    state.expandedAt.clear();
    state.undoStack = [];
    undoBtn.disabled = true;
    scoreEl.textContent = "0";
    highEl.textContent = state.highscore;
    hideOverlay();

    for (const t of tileEls.values()) t.el.remove();
    tileEls.clear();
    nextTileId = 0;

    spawnRandom(state.board);
    spawnRandom(state.board);

    computeLayout();
    redrawTiles();

    try { localStorage.setItem(CFG.SEED_KEY, String(state.seed)); } catch {}
    saveState();
  }

  function restart() {
    if (state.animating) return;
    clearState();
    startGameWithSeed(randomSeed());
  }

  function requestNewGame() {
    if (state.animating) return;
    // Если игра уже окончена — не спрашиваем
    if (state.gameOver) { restart(); return; }
    openConfirmModal();
  }

  function redrawTiles() {
    for (const t of tileEls.values()) t.el.remove();
    tileEls.clear();
    nextTileId = 0;
    for (let r = 0; r < state.rows; r++) {
      for (let c = 0; c < state.cols; c++) {
        const v = state.board[r][c];
        if (v) {
          const id = nextTileId++;
          const tile = createTileEl(r, c, v, false);
          tileEls.set(id, tile);
        }
      }
    }
  }

  function undo() {
    if (state.animating || !state.undoStack.length) return;
    hideOverlay();
    state.gameOver = false;

    const snapshot = state.undoStack.pop();
    state.board = snapshot.board.map(r => [...r]);
    state.score = snapshot.score;
    state.achieved = new Set(snapshot.achieved);

    // Восстанавливаем размеры поля из snapshot (на случай расширения)
    state.rows = state.board.length;
    state.cols = state.board[0].length;

    scoreEl.textContent = state.score;
    undoBtn.disabled = state.undoStack.length === 0;
    computeLayout();
    redrawTiles();
    saveState();
  }

  /* ============================================================
   * PERSISTENCE
   * ============================================================ */
  function loadHighscore() {
    try {
      const v = localStorage.getItem(CFG.SCORE_KEY);
      return v ? parseInt(v, 10) || 0 : 0;
    } catch { return 0; }
  }
  function saveHighscore(v) {
    try { localStorage.setItem(CFG.SCORE_KEY, String(v)); } catch {}
  }

  function serializeState() {
    return {
      version: 2,
      size: { rows: state.rows, cols: state.cols },
      seed: state.seed,
      rngState: state.rng.snapshot(),
      board: state.board,
      score: state.score,
      highscore: state.highscore,
      achieved: Array.from(state.achieved),
      expandedAt: Array.from(state.expandedAt),
      gameOver: state.gameOver
    };
  }

  function deserializeState(obj) {
    if (!obj || typeof obj !== "object") return null;
    try {
      // Поддержка версии 1 (фиксированное 4×4) и версии 2 (переменное)
      let rows = CFG.BASE_SIZE, cols = CFG.BASE_SIZE;
      if (obj.version === 2 && obj.size) {
        rows = obj.size.rows | 0;
        cols = obj.size.cols | 0;
      }
      if (!Array.isArray(obj.board) || obj.board.length !== rows) return null;
      for (const row of obj.board) {
        if (!Array.isArray(row) || row.length !== cols) return null;
        for (const v of row) {
          if (typeof v !== "number" || v < 0) return null;
        }
      }
      return {
        rows, cols,
        seed: (obj.seed >>> 0) || 0,
        rngState: (obj.rngState >>> 0) || 0,
        board: obj.board.map(r => r.slice()),
        score: Number(obj.score) || 0,
        highscore: Number(obj.highscore) || 0,
        achieved: new Set(Array.isArray(obj.achieved) ? obj.achieved : []),
        expandedAt: new Set(Array.isArray(obj.expandedAt) ? obj.expandedAt : []),
        gameOver: !!obj.gameOver
      };
    } catch { return null; }
  }

  function saveState() {
    if (!CFG.AUTOSAVE) return;
    try {
      localStorage.setItem(CFG.STATE_KEY, JSON.stringify(serializeState()));
    } catch (e) {
      console.warn("Не удалось сохранить партию:", e);
    }
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(CFG.STATE_KEY);
      if (!raw) return null;
      return deserializeState(JSON.parse(raw));
    } catch (e) {
      console.warn("Не удалось прочитать партию:", e);
      return null;
    }
  }

  function clearState() {
    try { localStorage.removeItem(CFG.STATE_KEY); } catch {}
  }

  function applyLoadedState(st) {
    state.rows = st.rows;
    state.cols = st.cols;
    state.seed = st.seed;
    state.rng = createRng(1);
    state.rng.restore(st.rngState);

    state.board = st.board.map(r => r.slice());
    state.score = st.score;
    state.highscore = Math.max(st.highscore, state.highscore);
    saveHighscore(state.highscore);
    state.achieved = new Set(st.achieved);
    state.expandedAt = new Set(st.expandedAt);
    state.gameOver = st.gameOver;

    state.undoStack = [];
    undoBtn.disabled = true;

    for (const t of tileEls.values()) t.el.remove();
    tileEls.clear();
    nextTileId = 0;

    computeLayout();
    redrawTiles();

    scoreEl.textContent = state.score;
    highEl.textContent = state.highscore;
    hideOverlay();

    if (state.gameOver) {
      showOverlay("ИГРА ОКОНЧЕНА", "Нажмите «Новая игра»",
                  "⟳ Начать заново", () => { hideOverlay(); requestNewGame(); });
    }
  }

  /* ============================================================
   * HASH  (v1: 4×4, v2: переменное поле)
   * ============================================================ */
  function valToExp(v) { return v === 0 ? 0 : Math.round(Math.log2(v)); }
  function expToVal(e) { return e === 0 ? 0 : 2 ** e; }

  function bitsToBytes(bits) {
    const bytes = new Uint8Array(bits.length / 8);
    for (let i = 0; i < bits.length; i++) {
      if (bits[i]) bytes[i >> 3] |= (1 << (7 - (i & 7)));
    }
    return bytes;
  }
  function bytesToBits(bytes, bitLen) {
    const bits = new Uint8Array(bitLen);
    for (let i = 0; i < bitLen; i++) {
      bits[i] = (bytes[i >> 3] >> (7 - (i & 7))) & 1;
    }
    return bits;
  }
  function writeUint(bits, value, bitLen) {
    for (let i = bitLen - 1; i >= 0; i--) bits.push((value >>> i) & 1);
  }
  function readUint(bits, offset, bitLen) {
    let v = 0;
    for (let i = 0; i < bitLen; i++) v = (v << 1) | bits[offset + i];
    return v >>> 0;
  }

  function encodeHashV2() {
    const bits = [];
    // Заголовок: rows (4 бита), cols (4 бита)
    writeUint(bits, state.rows, 4);
    writeUint(bits, state.cols, 4);
    // Ячейки
    for (let r = 0; r < state.rows; r++)
      for (let c = 0; c < state.cols; c++)
        writeUint(bits, valToExp(state.board[r][c]), 5);

    writeUint(bits, state.seed >>> 0, 32);
    writeUint(bits, state.rng.snapshot() >>> 0, 32);
    writeUint(bits, Math.min(state.score, 0xFFFFFF) >>> 0, 24);
    writeUint(bits, Math.min(state.highscore, 0xFFFFFF) >>> 0, 24);
    for (const th of CFG.WIN_THRESHOLDS) bits.push(state.achieved.has(th) ? 1 : 0);
    for (const th of CFG.WIN_THRESHOLDS) bits.push(state.expandedAt.has(th) ? 1 : 0);
    bits.push(state.gameOver ? 1 : 0);

    while (bits.length % 8 !== 0) bits.push(0);

    const bytes = bitsToBytes(bits);
    const payload = String.fromCharCode(CFG.HASH_VERSION_2) +
                    String.fromCharCode(...bytes);
    const b64 = btoa(payload)
      .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    return CFG.HASH_PREFIX + b64;
  }

  // Старый формат v1 (4×4) — для обратной совместимости при чтении
  function decodeHashV1(bytes, bitLen) {
    const bits = bytesToBits(bytes, bitLen);
    let off = 0;
    const newBoard = Array.from({ length: CFG.BASE_SIZE }, () => Array(CFG.BASE_SIZE).fill(0));
    for (let r = 0; r < CFG.BASE_SIZE; r++)
      for (let c = 0; c < CFG.BASE_SIZE; c++) {
        const e = readUint(bits, off, 5); off += 5;
        if (e > 17) return null;
        newBoard[r][c] = expToVal(e);
      }
    const seed = readUint(bits, off, 32); off += 32;
    const rngState = readUint(bits, off, 32); off += 32;
    const sc = readUint(bits, off, 24); off += 24;
    const hi = readUint(bits, off, 24); off += 24;
    const newAchieved = new Set();
    for (const th of CFG.WIN_THRESHOLDS) {
      const bit = readUint(bits, off, 1); off += 1;
      if (bit) newAchieved.add(th);
    }
    const go = readUint(bits, off, 1) === 1;
    return {
      rows: CFG.BASE_SIZE, cols: CFG.BASE_SIZE,
      seed, rngState, board: newBoard, score: sc,
      highscore: hi, achieved: newAchieved,
      expandedAt: new Set(), gameOver: go
    };
  }

  function decodeHashV2(bytes, bitLen) {
    const bits = bytesToBits(bytes, bitLen);
    let off = 0;
    const rows = readUint(bits, off, 4); off += 4;
    const cols = readUint(bits, off, 4); off += 4;
    if (rows < 1 || rows > 15 || cols < 1 || cols > 15) return null;

    const newBoard = Array.from({ length: rows }, () => Array(cols).fill(0));
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++) {
        const e = readUint(bits, off, 5); off += 5;
        if (e > 17) return null;
        newBoard[r][c] = expToVal(e);
      }

    const seed = readUint(bits, off, 32); off += 32;
    const rngState = readUint(bits, off, 32); off += 32;
    const sc = readUint(bits, off, 24); off += 24;
    const hi = readUint(bits, off, 24); off += 24;

    const newAchieved = new Set();
    for (const th of CFG.WIN_THRESHOLDS) {
      const bit = readUint(bits, off, 1); off += 1;
      if (bit) newAchieved.add(th);
    }
    const newExpanded = new Set();
    for (const th of CFG.WIN_THRESHOLDS) {
      const bit = readUint(bits, off, 1); off += 1;
      if (bit) newExpanded.add(th);
    }
    const go = readUint(bits, off, 1) === 1;

    return {
      rows, cols, seed, rngState, board: newBoard, score: sc,
      highscore: hi, achieved: newAchieved,
      expandedAt: newExpanded, gameOver: go
    };
  }

  function encodeHash() {
    try { return encodeHashV2(); }
    catch { return null; }
  }

  function decodeHash(str) {
    if (typeof str !== "string") return null;
    str = str.trim();
    if (!str.startsWith(CFG.HASH_PREFIX)) return null;
    const b64 = str.slice(CFG.HASH_PREFIX.length)
      .replace(/-/g, "+").replace(/_/g, "/");
    const pad = (4 - (b64.length % 4)) % 4;
    let raw;
    try { raw = atob(b64 + "=".repeat(pad)); }
    catch { return null; }
    if (raw.length < 2) return null;

    const version = raw.charCodeAt(0);
    const bytes = new Uint8Array(raw.length - 1);
    for (let i = 1; i < raw.length; i++) bytes[i - 1] = raw.charCodeAt(i);
    const bitLen = bytes.length * 8;

    if (version === CFG.HASH_VERSION_1) return decodeHashV1(bytes, bitLen);
    if (version === CFG.HASH_VERSION_2) return decodeHashV2(bytes, bitLen);
    return null;
  }

  function applyHashState(st) {
    state.rows = st.rows;
    state.cols = st.cols;
    state.seed = st.seed >>> 0;
    state.rng = createRng(1);
    state.rng.restore(st.rngState >>> 0);

    state.board = st.board.map(r => r.slice());
    state.score = st.score;
    state.highscore = Math.max(st.highscore, state.highscore);
    saveHighscore(state.highscore);
    state.achieved = new Set(st.achieved);
    state.expandedAt = new Set(st.expandedAt || []);
    state.gameOver = !!st.gameOver;

    state.undoStack = [];
    undoBtn.disabled = true;

    for (const t of tileEls.values()) t.el.remove();
    tileEls.clear();
    nextTileId = 0;

    computeLayout();
    redrawTiles();

    scoreEl.textContent = state.score;
    highEl.textContent = state.highscore;
    hideOverlay();

    if (state.gameOver) {
      showOverlay("ИГРА ОКОНЧЕНА", "Нажмите «Новая игра»",
                  "⟳ Начать заново", () => { hideOverlay(); requestNewGame(); });
    }

    saveState();
  }

  /* ============================================================
   * MODALS
   * ============================================================ */
  function setStatus(msg, isError = false) {
    hashStatus.textContent = msg;
    hashStatus.classList.toggle("error", isError);
  }

  function openShareModal() {
    if (state.animating) return;
    try {
      const key = encodeHash();
      if (!key) throw new Error("encode failed");
      hashIO.value = key;
    } catch {
      hashIO.value = "";
      setStatus("Не удалось сформировать ключ", true);
      return;
    }
    setStatus("Ключ сформирован. Можно копировать или вставить свой.");
    shareModal.classList.add("show");
  }

  function closeShareModal() {
    shareModal.classList.remove("show");
    setStatus("");
  }

  async function copyHash() {
    const txt = hashIO.value.trim();
    if (!txt) { setStatus("Нечего копировать", true); return; }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(txt);
      } else {
        hashIO.select();
        document.execCommand("copy");
        window.getSelection().removeAllRanges();
      }
      setStatus("Скопировано ✓");
    } catch {
      hashIO.select();
      setStatus("Выделено, нажмите «Копировать» в меню", true);
    }
  }

  function loadHash() {
    const txt = hashIO.value.trim();
    if (!txt) { setStatus("Вставьте ключ в поле", true); return; }
    const st = decodeHash(txt);
    if (!st) { setStatus("Неверный или повреждённый ключ", true); return; }
    applyHashState(st);
    setStatus("Партия загружена ✓");
    setTimeout(closeShareModal, 500);
  }

  function openConfirmModal() { confirmModal.classList.add("show"); }
  function closeConfirmModal() { confirmModal.classList.remove("show"); }

  confirmOk.addEventListener("click", () => {
    closeConfirmModal();
    restart();
  });
  confirmCancel.addEventListener("click", closeConfirmModal);
  confirmModal.addEventListener("click", e => {
    if (e.target === confirmModal) closeConfirmModal();
  });

  /* ============================================================
   * INPUT
   * ============================================================ */
  function attachSwipe(el, callback) {
    let sx = 0, sy = 0, active = false;
    el.addEventListener("touchstart", e => {
      if (e.touches.length !== 1) return;
      const t = e.touches[0];
      sx = t.clientX; sy = t.clientY; active = true;
    }, { passive: true });

    el.addEventListener("touchmove", e => { e.preventDefault(); }, { passive: false });

    el.addEventListener("touchend", e => {
      if (!active) return;
      active = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - sx, dy = t.clientY - sy;
      const ax = Math.abs(dx), ay = Math.abs(dy);
      if (Math.max(ax, ay) < CFG.SWIPE_MIN) return;
      if (ax > ay) callback(dx > 0 ? "right" : "left");
      else         callback(dy > 0 ? "down"  : "up");
    }, { passive: true });

    el.addEventListener("mousedown", e => { sx = e.clientX; sy = e.clientY; active = true; });
    el.addEventListener("mouseup", e => {
      if (!active) return;
      active = false;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      const ax = Math.abs(dx), ay = Math.abs(dy);
      if (Math.max(ax, ay) < CFG.SWIPE_MIN) return;
      if (ax > ay) callback(dx > 0 ? "right" : "left");
      else         callback(dy > 0 ? "down"  : "up");
    });
  }

  newBtn.addEventListener("click", requestNewGame);
  undoBtn.addEventListener("click", undo);
  shareBtn.addEventListener("click", openShareModal);
  hashCopy.addEventListener("click", copyHash);
  hashLoad.addEventListener("click", loadHash);
  hashClose.addEventListener("click", closeShareModal);
  shareModal.addEventListener("click", e => {
    if (e.target === shareModal) closeShareModal();
  });

  document.addEventListener("keydown", e => {
    if (confirmModal.classList.contains("show")) {
      if (e.key === "Escape") closeConfirmModal();
      return;
    }
    const map = { ArrowLeft: "left", ArrowRight: "right",
                  ArrowUp: "up", ArrowDown: "down" };
    if (map[e.key]) { e.preventDefault(); handleMove(map[e.key]); }
    else if (e.key === "r" || e.key === "R") requestNewGame();
    else if ((e.ctrlKey || e.metaKey) && e.key === "z") undo();
    else if (e.key === "Escape" && shareModal.classList.contains("show")) {
      closeShareModal();
    }
  });

  document.addEventListener("gesturestart", e => e.preventDefault());

  /* ============================================================
   * INIT
   * ============================================================ */
  function init() {
    state.highscore = loadHighscore();
    highEl.textContent = state.highscore;

    // Первичная раскладка (до загрузки партии, чтобы размеры были известны)
    state.rows = CFG.BASE_SIZE;
    state.cols = CFG.BASE_SIZE;
    state.board = Array.from({ length: state.rows }, () => Array(state.cols).fill(0));
    computeLayout();

    const saved = loadState();
    if (saved) {
      applyLoadedState(saved);
    } else {
      let seed = null;
      try {
        const stored = localStorage.getItem(CFG.SEED_KEY);
        if (stored) seed = parseInt(stored, 10);
      } catch {}
      if (!seed || isNaN(seed)) seed = randomSeed();
      startGameWithSeed(seed);
    }

    attachSwipe(boardEl, handleMove);

    let rafId = null;
    const relayout = () => {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(() => {
        computeLayout();
        redrawTiles();
        rafId = null;
      });
    };

    window.addEventListener("resize", relayout);
    window.addEventListener("orientationchange", () => setTimeout(relayout, 200));
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", relayout);
      window.visualViewport.addEventListener("scroll", relayout);
    }

    window.addEventListener("pagehide", saveState);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") saveState();
    });
  }

  if (document.readyState === "complete") init();
  else window.addEventListener("load", init);
})();
</script>
</body>
